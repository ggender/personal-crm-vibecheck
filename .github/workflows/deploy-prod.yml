# Prod by hand: Actions → Deploy prod → Run workflow, the SHA of the image.
# The same workflow rolls back: run it with the SHA of the previous version.
name: Deploy prod

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "SHA коммита (можно короткий), который прошёл тест-стенд"
        required: true

permissions:
  contents: read
  packages: write
  deployments: read

# One deploy at a time per stand. A shared group would let a queued prod
# deploy cancel the queued staging deploy of the newest commit.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  prod:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PROD_URL }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Full SHA
        id: sha
        run: |
          full=$(gh api "repos/${{ github.repository }}/commits/${{ inputs.sha }}" --jq .sha)
          echo "Deploying $full"
          echo "full=$full" >> "$GITHUB_OUTPUT"
      - name: The SHA passed the test stand
        run: |
          sha=${{ steps.sha.outputs.full }}
          for id in $(gh api "repos/${{ github.repository }}/deployments?environment=staging&sha=$sha" --jq '.[].id'); do
            state=$(gh api "repos/${{ github.repository }}/deployments/$id/statuses" --jq '.[0].state')
            if [ "$state" = success ]; then
              echo "Staging deployment $id: success"
              exit 0
            fi
          done
          echo "::error::Коммит $sha не прошёл тест-стенд - на прод не катим"
          exit 1
      # Server scripts always come from main, also on a rollback to an older commit.
      - uses: actions/checkout@v4
      - name: SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          echo "${{ vars.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Server scripts from main
        run: scp -i ~/.ssh/deploy deploy/compose.yml deploy/*.sh deploy@${{ vars.SERVER_HOST }}:/opt/crm/
      - name: Deploy
        run: |
          ssh -i ~/.ssh/deploy deploy@${{ vars.SERVER_HOST }} \
            "for i in 1 2 3 4 5; do echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin >/dev/null && break; echo registry login retry; sleep 5; done; \
             /opt/crm/deploy.sh prod ${{ steps.sha.outputs.full }}; code=\$?; docker logout ghcr.io >/dev/null; exit \$code"
      - name: Smoke test
        run: curl -fsS --retry 10 --retry-all-errors --retry-delay 3 "${{ vars.PROD_URL }}/api/health"
      # Keep the newest 10 builds in GHCR. Counted by builds, not by prod
      # versions: with 3, the previous prod version was already gone.
      - uses: actions/delete-package-versions@v5
        with:
          package-name: personal-crm-vibecheck
          package-type: container
          min-versions-to-keep: 10
