# After merge to main: build the image once, tag it with the commit SHA,
# push to GHCR and put it on the test stand.
name: Deploy staging

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

# One deploy at a time, staging and prod share the group.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/ggender/personal-crm-vibecheck

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          platforms: linux/amd64
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  staging:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          echo "${{ vars.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Server scripts of this commit
        run: scp -i ~/.ssh/deploy deploy/compose.yml deploy/*.sh deploy@${{ vars.SERVER_HOST }}:/opt/crm/
      - name: Deploy
        run: |
          ssh -i ~/.ssh/deploy deploy@${{ vars.SERVER_HOST }} \
            "for i in 1 2 3 4 5; do echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin >/dev/null && break; echo registry login retry; sleep 5; done; \
             /opt/crm/deploy.sh staging ${{ github.sha }}; code=\$?; docker logout ghcr.io >/dev/null; exit \$code"
      - name: Smoke test
        run: curl -fsS --retry 10 --retry-all-errors --retry-delay 3 "${{ vars.STAGING_URL }}/api/health"
