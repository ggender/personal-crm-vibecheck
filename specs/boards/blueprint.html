<title>Личная CRM: карта опыта</title>

<style>
/* ─────────────────────────────────────────────────────────
   vibe-check diagram engine, shared design layer
   Built on the ClearList design system tokens.
   FigJam structure (sticky notes, tape, dots, dotted canvas)
   + Minimalist Editorial typography (DM Sans / DM Serif Display).
   One file, many diagram templates.
   ───────────────────────────────────────────────────────── */

:root{
  /* canvas */
  --canvas:#F9F6F0;          /* warm FigJam canvas */
  --canvas-app:#F9F9F8;      /* editorial / blueprint canvas */
  --dot:#ddd6c6;
  --grid-line:rgba(44,100,227,.10);

  /* ink */
  --charcoal:#1A1A1B;
  --ink-2:#4b5563;
  --ink-muted:#6B7280;
  --border:#E5E5E5;

  /* brand */
  --blue:#2C64E3;
  --blue-hover:#2354C2;
  --purple:#8B5CF6;
  --purple-light:#F5F3FF;
  --pink:#ec4899;

  /* moving-sale / figjam */
  --kraft:#C4A882;
  --kraft-dark:#A98C63;
  --tape-blue:#4A90D9;
  --y:#FFF6A8;   /* softened post-it yellow for sans legibility */
  --g:#A6E4A0;
  --b:#A8DBEE;
  --o:#FFCB7D;
  --p:#FFA8CC;
  --lav:#CDBEEA; /* AI = purple family */

  /* status dots */
  --dot-red:#E03C31;
  --dot-green:#2E8B57;
  --dot-amber:#F6C90E;

  /* fonts */
  --sans:"DM Sans",ui-sans-serif,system-ui,sans-serif;
  --serif:"DM Serif Display",Georgia,serif;
}

*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:1920px;height:1080px;overflow:hidden;}
body{font-family:var(--sans);color:var(--charcoal);-webkit-font-smoothing:antialiased;}

/* canvases */
.canvas-dots{
  background-color:var(--canvas);
  background-image:radial-gradient(var(--dot) 2px,transparent 2px);
  background-size:30px 30px;background-position:-6px -6px;
}
.canvas-blueprint{
  background-color:var(--canvas-app);
  background-image:linear-gradient(var(--grid-line) 1px,transparent 1px),
                   linear-gradient(90deg,var(--grid-line) 1px,transparent 1px);
  background-size:48px 48px;
}

.stage{width:1920px;height:1080px;padding:40px 52px 34px;position:relative;display:flex;flex-direction:column;}

/* ── header ───────────────────────────────── */
.head{display:flex;align-items:flex-start;justify-content:space-between;flex:0 0 auto;}
.head .crumb{font-weight:700;font-size:14px;letter-spacing:.18em;text-transform:uppercase;color:var(--blue);margin-bottom:6px;}
.head .title{font-family:var(--serif);font-size:46px;line-height:1.02;color:var(--charcoal);}
.head .sub{font-size:19px;color:var(--ink-muted);margin-top:10px;max-width:760px;}
.madeby{text-align:right;font-size:15px;color:var(--ink-muted);line-height:1.3;text-decoration:none;}
.madeby:hover b{text-decoration:underline;}
.madeby b{font-weight:700;color:var(--blue);letter-spacing:.02em;}
.madeby .url{color:var(--blue);font-weight:600;}

/* ── sticky note ──────────────────────────── */
.note{
  background:var(--y);
  padding:13px 15px 14px;
  box-shadow:3px 4px 12px rgba(0,0,0,.13);
  position:relative;line-height:1.24;font-size:19px;font-weight:500;
  border-radius:1px;
}
.note .k{display:block;font-weight:700;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:rgba(0,0,0,.40);margin-bottom:5px;}
.note.sm{font-size:17px;padding:10px 13px;box-shadow:2px 3px 9px rgba(0,0,0,.11);}
.note.lg{font-size:21px;}
.note.y{background:var(--y);} .note.g{background:var(--g);} .note.b{background:var(--b);}
.note.o{background:var(--o);} .note.p{background:var(--p);} .note.ai{background:var(--lav);}
/* gentle hand-placed tilt + a tape nub */
.tilt-l{transform:rotate(-1.3deg);} .tilt-r{transform:rotate(1.1deg);} .tilt-0{transform:rotate(-.4deg);}
.note.pin:before{content:"";position:absolute;top:-7px;left:50%;width:34px;height:12px;
  background:rgba(74,144,217,.78);transform:translateX(-50%) rotate(-4deg);box-shadow:1px 1px 3px rgba(0,0,0,.18);}

/* ── tape strip / lane label ──────────────── */
.tape{display:inline-block;background:var(--tape-blue);color:#fff;font-weight:700;text-transform:uppercase;
  letter-spacing:.06em;padding:9px 16px;box-shadow:2px 3px 9px rgba(0,0,0,.16);position:relative;}
.tape:before,.tape:after{content:"";position:absolute;top:0;bottom:0;width:14px;
  background:repeating-linear-gradient(135deg,rgba(255,255,255,.28) 0 4px,transparent 4px 8px);}
.tape:before{left:-7px;transform:skewX(-12deg);} .tape:after{right:-7px;transform:skewX(-12deg);}
.tape.green{background:var(--dot-green);} .tape.kraftt{background:#b9b09c;} .tape.charcoal{background:var(--charcoal);}

/* ── editorial / blueprint box ────────────── */
.ebox{background:#fff;border:2px solid var(--charcoal);padding:14px 16px;min-width:160px;position:relative;}
.ebox .t{font-weight:700;font-size:19px;line-height:1.15;}
.ebox .s{font-size:15px;color:var(--ink-muted);margin-top:4px;line-height:1.25;}
.ebox.ai{background:var(--purple-light);border-color:var(--purple);}
.ebox.ai .tag{position:absolute;top:-11px;left:14px;background:var(--purple);color:#fff;font-size:11px;font-weight:700;
  letter-spacing:.12em;text-transform:uppercase;padding:2px 8px;}
.ebox.accent{border-color:var(--blue);}

/* ── garage-sale dot sticker ──────────────── */
.dot{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;color:#fff;
  font-weight:700;text-align:center;line-height:1;box-shadow:2px 2px 6px rgba(0,0,0,.22);}
.dot.red{background:var(--dot-red);} .dot.green{background:var(--dot-green);}
.dot.amber{background:var(--dot-amber);color:#3a2e00;} .dot.blue{background:var(--tape-blue);}

/* small legend chip */
.chip{display:inline-flex;align-items:center;gap:8px;font-size:15px;color:var(--ink-2);font-weight:500;}
.chip .sw{width:16px;height:16px;border-radius:50%;}

</style>

  .c.touch{background:var(--t-touch);color:#fff;} .c.roles{background:var(--t-roles);color:#fff;}
  .c.process{background:var(--t-process);color:#2a2a2a;} .c.tech{background:var(--t-tech);color:#fff;}
  .c.policy{background:var(--t-policy);color:#3a2a05;} .c.critical{background:var(--t-critical);color:#fff;}

  .madeby2{position:absolute;right:44px;bottom:14px;font-size:13px;color:var(--ink-muted);text-decoration:none;}

<script>
// ─── Engine config: the layer taxonomy (per the Practical Experience Blueprinting guide) ───
const COMMON = [
  {id:'touchpoint',label:'Точка касания',hint:'что ты видишь и жмёшь',desc:'что человек видит, читает и нажимает',cls:'touch'},
  {id:'roles',label:'Роли',hint:'кто участвует',desc:'кто участвует в этом шаге',cls:'roles'},
  {id:'process',label:'Процесс',hint:'работа за кулисами',desc:'что происходит за кулисами, чтобы шаг сработал',cls:'process'},
  {id:'technology',label:'Технологии',hint:'чем это делается',desc:'инструменты, которые делают работу',cls:'tech'},
  {id:'policy',label:'Правила',hint:'что ты решил',desc:'правило, которое ты выбрал',cls:'policy'},
];
const CURRENT = [
  {id:'critical',label:'Critical Moments',hint:'what can go wrong',desc:'where the experience breaks today',cls:'critical'},
  {id:'opportunity',label:'Opportunities',hint:'ideas to improve',desc:'ideas or ah-ha fixes for this step',cls:'opp'},
  {id:'metric',label:'Metrics',hint:'data for this step',desc:'data or analytics about this step',cls:'metric'},
];
const FUTURE = [
  {id:'pitfall',label:'Где сломается',hint:'возможные ловушки',desc:'что здесь может пойти не так',cls:'pitfall'},
  {id:'rationale',label:'Почему так',hint:'обоснование',desc:'почему сделано именно так',cls:'rationale'},
];
const TAIL = [
  {id:'question',label:'Вопросы',hint:'ещё не решено',desc:'что ещё предстоит решить',cls:'question'},
  {id:'note',label:'Заметки',hint:'стоит помнить',desc:'что ещё стоит помнить',cls:'notes'},
];
const SWATCH = {phase:'var(--t-phase)',step:'var(--t-step)',hidden:'var(--t-hidden)',touch:'var(--t-touch)',
  roles:'var(--t-roles)',process:'var(--t-process)',tech:'var(--t-tech)',policy:'var(--t-policy)',
  critical:'var(--t-critical)',opp:'var(--t-opp)',metric:'var(--t-metric)',pitfall:'var(--t-pitfall)',
  rationale:'var(--t-rationale)',question:'var(--t-question)',notes:'var(--t-notes)'};

const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function layersFor(state){ return [...COMMON, ...(state==='current'?CURRENT:FUTURE), ...TAIL]; }

function render(bp){
  const state = bp.state==='current' ? 'current' : 'future';
  const layers = layersFor(state);
  const steps = bp.steps || [];
  const n = steps.length;

  document.getElementById('crumb').textContent = 'Карта опыта · будущее состояние';
  document.getElementById('offering').innerHTML = 'Продукт: <b>'+esc(bp.offering||'')+'</b>';
  document.getElementById('scn').textContent = 'Сценарий: ' + (bp.scenario||'');

  // explainer
  if(bp.explainer){
    const e = bp.explainer;
    document.getElementById('explainer').innerHTML =
      '<div class="explainer"><div class="eh">'+esc(e.title||'')+'</div><p>'+esc(e.body||'')+'</p>'+
      (e.read?'<div class="read">'+esc(e.read)+'</div>':'')+'</div>';
  }

  // legend
  const head = [
    {cls:'phase',label:'Фаза',desc:'глава пути'},
    {cls:'step',label:'Шаг · видимый',desc:'то, что человек видит или делает',bord:true},
    {cls:'hidden',label:'Шаг · за кулисами',desc:'происходит внутри; человек этого не видит'},
  ];
  const legendItems = [...head, ...layers.map(L=>({cls:L.cls,label:L.label,desc:L.desc}))];
  document.getElementById('legend').innerHTML =
    '<h3>Легенда</h3><div class="lh-sub">Каждая карточка — одного из этих типов. Цвет говорит, какого.</div>' +
    legendItems.map(it =>
      '<div class="lrow"><span class="sw'+(it.bord?' bord':'')+'" style="background:'+SWATCH[it.cls]+'"></span>'+
      '<span><span class="lab">'+esc(it.label)+'</span><span class="des">'+esc(it.desc)+'</span></span></div>'
    ).join('') +
    '<div class="pti"><div class="t">Полоса фаз</div><div class="pti-bar">Жёлтые полосы сверху собирают шаги в главы.</div></div>';

  // grid
  const bpEl = document.getElementById('bp');
  bpEl.style.gridTemplateColumns = '160px repeat('+n+',1fr)';

  let html = '';
  // phases row
  html += '<div class="ph-l">Фазы</div>';
  (bp.phases||[]).forEach(p=>{
    const from = Number(p.from), to = Number(p.to);
    const sub = to>from ? (from+'–'+to) : (''+from);
    html += '<div style="grid-column:'+(from+1)+' / '+(to+2)+'"><div class="phase">'+esc(p.name)+'<span class="ph-sub">'+esc(sub)+'</span></div></div>';
  });
  // steps row
  html += '<div class="lane-l">Шаги<span class="lhint">путь по кусочкам</span></div>';
  steps.forEach(s=>{
    html += '<div class="cell stepcell"><div class="c step'+(s.hidden?' hidden':'')+'">'+
      (s.hidden?'<span class="htag">За кулисами</span>':'')+
      '<span class="snum">'+esc(s.n)+'</span><span class="sname">'+esc(s.name)+'</span>'+
      '<span class="sdef">'+esc(s.def||'')+'</span></div></div>';
  });
  // layer rows
  layers.forEach((L,idx)=>{
    const band = idx%2===1;
    html += '<div class="lane-l'+(band?' bnd':'')+'">'+esc(L.label)+'<span class="lhint">'+esc(L.hint)+'</span></div>';
    const data = (bp.layers&&bp.layers[L.id]) || {};
    steps.forEach(s=>{
      let v = data[s.n] != null ? data[s.n] : data[String(s.n)];
      let cards = '';
      if(v){ (Array.isArray(v)?v:[v]).forEach(t=>{ cards += '<div class="c '+L.cls+'">'+esc(t)+'</div>'; }); }
      html += '<div class="cell'+(band?' bnd':'')+'">'+cards+'</div>';
    });
  });
  bpEl.innerHTML = html;
  document.body.setAttribute('data-rendered','1');
}

async function main(){
  const param = new URLSearchParams(location.search).get('data') || 'clearlist';
  try{
    const bp = await fetch('./data-'+param+'.json',{cache:'no-store'}).then(r=>{ if(!r.ok) throw new Error(r.status); return r.json(); });
    render(bp);
  }catch(err){
    document.querySelector('.main').innerHTML = '<div class="err">Could not load data-'+esc(param)+'.json: '+esc(err.message)+'</div>';
    document.body.setAttribute('data-rendered','1');
  }
}
main();
</script>
</body>
</html>
