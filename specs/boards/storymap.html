<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Личная CRM: карта истории</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
/* ─────────────────────────────────────────────────────────
   vibe-check diagram engine, shared design layer
   Built on the ClearList design system tokens.
   FigJam structure (sticky notes, tape, dots, dotted canvas)
   + Minimalist Editorial typography (DM Sans / DM Serif Display).
   One file, many diagram templates.
   ───────────────────────────────────────────────────────── */

:root{
  /* canvas */
  --canvas:#F9F6F0;          /* warm FigJam canvas */
  --canvas-app:#F9F9F8;      /* editorial / blueprint canvas */
  --dot:#ddd6c6;
  --grid-line:rgba(44,100,227,.10);

  /* ink */
  --charcoal:#1A1A1B;
  --ink-2:#4b5563;
  --ink-muted:#6B7280;
  --border:#E5E5E5;

  /* brand */
  --blue:#2C64E3;
  --blue-hover:#2354C2;
  --purple:#8B5CF6;
  --purple-light:#F5F3FF;
  --pink:#ec4899;

  /* moving-sale / figjam */
  --kraft:#C4A882;
  --kraft-dark:#A98C63;
  --tape-blue:#4A90D9;
  --y:#FFF6A8;   /* softened post-it yellow for sans legibility */
  --g:#A6E4A0;
  --b:#A8DBEE;
  --o:#FFCB7D;
  --p:#FFA8CC;
  --lav:#CDBEEA; /* AI = purple family */

  /* status dots */
  --dot-red:#E03C31;
  --dot-green:#2E8B57;
  --dot-amber:#F6C90E;

  /* fonts */
  --sans:"DM Sans",ui-sans-serif,system-ui,sans-serif;
  --serif:"DM Serif Display",Georgia,serif;
}

*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:1920px;height:1080px;overflow:hidden;}
body{font-family:var(--sans);color:var(--charcoal);-webkit-font-smoothing:antialiased;}

/* canvases */
.canvas-dots{
  background-color:var(--canvas);
  background-image:radial-gradient(var(--dot) 2px,transparent 2px);
  background-size:30px 30px;background-position:-6px -6px;
}
.canvas-blueprint{
  background-color:var(--canvas-app);
  background-image:linear-gradient(var(--grid-line) 1px,transparent 1px),
                   linear-gradient(90deg,var(--grid-line) 1px,transparent 1px);
  background-size:48px 48px;
}

.stage{width:1920px;height:1080px;padding:40px 52px 34px;position:relative;display:flex;flex-direction:column;}

/* ── header ───────────────────────────────── */
.head{display:flex;align-items:flex-start;justify-content:space-between;flex:0 0 auto;}
.head .crumb{font-weight:700;font-size:14px;letter-spacing:.18em;text-transform:uppercase;color:var(--blue);margin-bottom:6px;}
.head .title{font-family:var(--serif);font-size:46px;line-height:1.02;color:var(--charcoal);}
.head .sub{font-size:19px;color:var(--ink-muted);margin-top:10px;max-width:760px;}
.madeby{text-align:right;font-size:15px;color:var(--ink-muted);line-height:1.3;text-decoration:none;}
.madeby:hover b{text-decoration:underline;}
.madeby b{font-weight:700;color:var(--blue);letter-spacing:.02em;}
.madeby .url{color:var(--blue);font-weight:600;}

/* ── sticky note ──────────────────────────── */
.note{
  background:var(--y);
  padding:13px 15px 14px;
  box-shadow:3px 4px 12px rgba(0,0,0,.13);
  position:relative;line-height:1.24;font-size:19px;font-weight:500;
  border-radius:1px;
}
.note .k{display:block;font-weight:700;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:rgba(0,0,0,.40);margin-bottom:5px;}
.note.sm{font-size:17px;padding:10px 13px;box-shadow:2px 3px 9px rgba(0,0,0,.11);}
.note.lg{font-size:21px;}
.note.y{background:var(--y);} .note.g{background:var(--g);} .note.b{background:var(--b);}
.note.o{background:var(--o);} .note.p{background:var(--p);} .note.ai{background:var(--lav);}
/* gentle hand-placed tilt + a tape nub */
.tilt-l{transform:rotate(-1.3deg);} .tilt-r{transform:rotate(1.1deg);} .tilt-0{transform:rotate(-.4deg);}
.note.pin:before{content:"";position:absolute;top:-7px;left:50%;width:34px;height:12px;
  background:rgba(74,144,217,.78);transform:translateX(-50%) rotate(-4deg);box-shadow:1px 1px 3px rgba(0,0,0,.18);}

/* ── tape strip / lane label ──────────────── */
.tape{display:inline-block;background:var(--tape-blue);color:#fff;font-weight:700;text-transform:uppercase;
  letter-spacing:.06em;padding:9px 16px;box-shadow:2px 3px 9px rgba(0,0,0,.16);position:relative;}
.tape:before,.tape:after{content:"";position:absolute;top:0;bottom:0;width:14px;
  background:repeating-linear-gradient(135deg,rgba(255,255,255,.28) 0 4px,transparent 4px 8px);}
.tape:before{left:-7px;transform:skewX(-12deg);} .tape:after{right:-7px;transform:skewX(-12deg);}
.tape.green{background:var(--dot-green);} .tape.kraftt{background:#b9b09c;} .tape.charcoal{background:var(--charcoal);}

/* ── editorial / blueprint box ────────────── */
.ebox{background:#fff;border:2px solid var(--charcoal);padding:14px 16px;min-width:160px;position:relative;}
.ebox .t{font-weight:700;font-size:19px;line-height:1.15;}
.ebox .s{font-size:15px;color:var(--ink-muted);margin-top:4px;line-height:1.25;}
.ebox.ai{background:var(--purple-light);border-color:var(--purple);}
.ebox.ai .tag{position:absolute;top:-11px;left:14px;background:var(--purple);color:#fff;font-size:11px;font-weight:700;
  letter-spacing:.12em;text-transform:uppercase;padding:2px 8px;}
.ebox.accent{border-color:var(--blue);}

/* ── garage-sale dot sticker ──────────────── */
.dot{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;color:#fff;
  font-weight:700;text-align:center;line-height:1;box-shadow:2px 2px 6px rgba(0,0,0,.22);}
.dot.red{background:var(--dot-red);} .dot.green{background:var(--dot-green);}
.dot.amber{background:var(--dot-amber);color:#3a2e00;} .dot.blue{background:var(--tape-blue);}

/* small legend chip */
.chip{display:inline-flex;align-items:center;gap:8px;font-size:15px;color:var(--ink-2);font-weight:500;}
.chip .sw{width:16px;height:16px;border-radius:50%;}

</style>
<style>
  .map{flex:1;margin-top:16px;display:grid;column-gap:13px;row-gap:14px;min-height:0;}
  .corner{display:flex;align-items:flex-end;padding-bottom:8px;}
  .corner span{font-size:14px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-muted);}
  .activity{background:linear-gradient(180deg,#cdb287,var(--kraft));border:2px solid var(--kraft-dark);
    box-shadow:2px 3px 0 var(--kraft-dark);padding:11px 13px;display:flex;flex-direction:column;gap:2px;justify-content:center;min-height:78px;}
  .activity .step{font-size:12px;font-weight:700;letter-spacing:.1em;color:#6f5a37;}
  .activity .name{font-size:20px;font-weight:700;line-height:1.08;color:#2b2417;}
  .lane{display:flex;flex-direction:column;gap:9px;padding-top:4px;}
  .lane .sub{font-size:15px;color:var(--ink-2);font-weight:500;padding-left:2px;line-height:1.25;}
  .lane .skel{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:var(--dot-green);}
  .lane .skel .gd{width:14px;height:14px;border-radius:50%;background:var(--dot-green);flex:0 0 auto;}
  .cell{display:flex;flex-direction:column;gap:10px;}
  /* walking-skeleton band: tint the whole V1 lane, no floating text */
  .v1band{background:rgba(46,139,87,.10);border-top:2px dashed var(--dot-green);border-bottom:2px dashed var(--dot-green);}
  .aha{display:inline-block;margin-top:8px;background:var(--dot-red);color:#fff;font-size:12px;font-weight:700;
    letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;}
  .err{padding:60px;font-size:20px;color:#DC2626;}
</style>
<script>window.__D__={"header": {"crumb": "Фаза 2 · Карта истории", "title": "Личная CRM: путь от «открыл» до «заметка сохранена»", "sub": "Читай слева направо: это шаги пользователя. Собирай сверху вниз: одна зелёная полоса уже настоящее рабочее приложение."}, "activities": [{"step": 1, "name": "Открыть приложение"}, {"step": 2, "name": "Найти человека"}, {"step": 3, "name": "Открыть карточку"}, {"step": 4, "name": "Дописать заметку"}, {"step": 5, "name": "Добавить нового"}, {"step": 6, "name": "Открыть в другом браузере"}], "releases": [{"id": "v1", "label": "V1 · собираем сейчас", "tape": "green", "subnote": "весь главный сценарий", "skeleton": "только эта полоса", "band": true}, {"id": "v2", "label": "V2 · когда V1 работает", "tape": "blue", "subnote": "удобства"}, {"id": "later", "label": "Потом · когда-нибудь", "tape": "kraft"}], "cells": {"v1": {"1": [{"kicker": "Видит", "text": "Весь список по алфавиту, 999 контактов уже внутри", "color": "g", "size": "sm", "pin": true}, {"kicker": "Видит", "text": "Курсор сразу в поиске, справа подсказка", "color": "y", "size": "sm"}], "2": [{"kicker": "Делает", "text": "Печатает, и список сужается на лету", "color": "g", "size": "sm", "pin": true}, {"kicker": "Правило", "text": "Поиск понимает русский: «анн» находит «Анна», «е» = «ё»", "color": "o", "size": "sm"}, {"kicker": "Пусто", "text": "Никого не нашлось: кнопка «Добавить такого»", "color": "y", "size": "sm"}], "3": [{"kicker": "Видит", "text": "Карточка рядом, список не пропадает", "color": "g", "size": "sm", "pin": true}, {"kicker": "Правило", "text": "Адрес помнит, кто открыт: обновил страницу, а карточка на месте", "color": "o", "size": "sm"}], "4": [{"kicker": "Делает", "text": "Пишет в поле заметки, оно первое в карточке", "color": "g", "size": "sm", "pin": true}, {"kicker": "Видит", "text": "Заметка встала сверху ленты с сегодняшней датой", "color": "b", "size": "sm", "aha": true}, {"kicker": "Плохой день", "text": "Не сохранилось: текст не пропал, видно почему", "color": "p", "size": "sm"}, {"kicker": "Делает", "text": "Удаляет заметку (с подтверждением)", "color": "y", "size": "sm"}], "5": [{"kicker": "Делает", "text": "Форма в правой панели, обязательно только имя", "color": "g", "size": "sm", "pin": true}, {"kicker": "Видит", "text": "Новый человек сразу в списке и открыт", "color": "b", "size": "sm"}, {"kicker": "Делает", "text": "Правит поля контакта той же формой", "color": "y", "size": "sm"}, {"kicker": "Делает", "text": "Удаляет контакт вместе с его заметками (с подтверждением)", "color": "y", "size": "sm"}], "6": [{"kicker": "Правило", "text": "Данные живут на сервере в одной базе, а не в браузере", "color": "o", "size": "sm", "pin": true}, {"kicker": "Видит", "text": "Те же контакты и та же новая заметка", "color": "b", "size": "sm", "aha": true}]}, "v2": {"1": [{"kicker": "Удобство", "text": "Последняя заметка строчкой под именем", "color": "b", "size": "sm"}], "2": [{"kicker": "Удобство", "text": "Enter открывает первого найденного; поиск по заметкам", "color": "b", "size": "sm"}], "3": [{"kicker": "Удобство", "text": "Телефонный вид: список и карточка по очереди", "color": "b", "size": "sm"}], "4": [{"kicker": "Удобство", "text": "Исправить текст заметки", "color": "b", "size": "sm"}], "5": [{"kicker": "Удобство", "text": "Отменить удаление («вернуть»)", "color": "b", "size": "sm"}], "6": [{"kicker": "Замок", "text": "Пароль на вход, прежде чем вносить настоящих людей", "color": "p", "size": "sm"}]}, "later": {"1": [{"kicker": "Идея", "text": "«Давно не общались»", "color": "y", "size": "sm"}], "2": [{"kicker": "Идея", "text": "Метки и группы", "color": "y", "size": "sm"}], "5": [{"kicker": "Идея", "text": "Импорт из контактов телефона", "color": "y", "size": "sm"}], "6": [{"kicker": "Идея", "text": "Выгрузка всей базы в файл", "color": "y", "size": "sm"}]}}};(function(){var f=window.fetch;window.fetch=function(u,o){if(/data-.*\.json/.test(String(u)))return Promise.resolve(new Response(JSON.stringify(window.__D__),{status:200,headers:{'Content-Type':'application/json'}}));return f.call(window,u,o);};})();</script><script>addEventListener('DOMContentLoaded',function(){var s=document.querySelector('.stage');function fit(){var k=Math.min(innerWidth/1920,innerHeight/1080);s.style.transformOrigin='0 0';s.style.transform='scale('+k+')';}addEventListener('resize',fit);fit();});</script>
</head>
<body class="canvas-dots">
<div class="stage">
  <div class="head">
    <div>
      <div class="crumb" id="crumb"></div>
      <div class="title" id="title"></div>
      <div class="sub" id="sub"></div>
    </div>
    <a class="madeby" href="https://github.com/TexasBedouin/vibe-check" target="_blank" rel="noopener noreferrer">Created using <b>Vibe-Check</b> skill</a>
  </div>

  <div class="map" id="map"></div>
</div>

<script>
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

// renderer-computed decoration, never stored in data
const TILTS = ['tilt-l','tilt-r','tilt-0'];
const NOTE_COLORS = {y:'y',g:'g',b:'b',o:'o',p:'p',ai:'ai'};

// tape ∈ green | blue | kraft  → class on the .tape element
function tapeClass(tape){
  if(tape === 'green') return 'tape green';
  if(tape === 'kraft') return 'tape kraftt';
  return 'tape'; // blue is the default tape-blue look
}

function noteHtml(note, idx){
  const color = NOTE_COLORS[note.color] || 'y';
  const cls = ['note', color];
  if(note.size === 'sm') cls.push('sm');
  if(note.pin) cls.push('pin');
  cls.push(TILTS[idx % TILTS.length]); // auto-cycle tilt by index
  const kicker = note.kicker ? '<span class="k">'+esc(note.kicker)+'</span>' : '';
  const aha = note.aha ? '<span class="aha">★ ага-момент</span>' : '';
  return '<div class="'+cls.join(' ')+'">'+kicker+esc(note.text||'')+aha+'</div>';
}

function render(sm){
  const activities = sm.activities || [];
  const releases = sm.releases || [];
  const cells = sm.cells || {};

  document.getElementById('crumb').textContent = (sm.header && sm.header.crumb) || '';
  document.getElementById('title').textContent = (sm.header && sm.header.title) || '';
  document.getElementById('sub').textContent = (sm.header && sm.header.sub) || '';

  const map = document.getElementById('map');
  // columns: a fixed lane-label column, then one flexible column per activity
  map.style.gridTemplateColumns = '172px repeat('+activities.length+',1fr)';

  let html = '';

  // ── backbone row: corner + one activity per column ──
  html += '<div class="corner"><span>путь ↓</span></div>';
  activities.forEach(a => {
    html += '<div class="activity"><span class="step">ШАГ '+esc(a.step)+'</span>'+
            '<span class="name">'+esc(a.name)+'</span></div>';
  });

  // ── one row per release lane ──
  releases.forEach(rel => {
    const band = rel.band ? ' v1band' : '';

    // lane label cell
    html += '<div class="lane">';
    html += '<span class="'+tapeClass(rel.tape)+'">'+esc(rel.label)+'</span>';
    if(rel.subnote) html += '<span class="sub">'+esc(rel.subnote)+'</span>';
    if(rel.skeleton) html += '<span class="skel"><span class="gd"></span>'+esc(rel.skeleton)+'</span>';
    html += '</div>';

    // one cell per activity column
    const laneCells = cells[rel.id] || {};
    activities.forEach(a => {
      let notes = laneCells[a.step];
      if(notes == null) notes = laneCells[String(a.step)];
      let inner = '';
      if(notes){
        (Array.isArray(notes) ? notes : [notes]).forEach((note, i) => {
          inner += noteHtml(note, i);
        });
      }
      html += '<div class="cell'+band+'">'+inner+'</div>';
    });
  });

  map.innerHTML = html;
  document.body.setAttribute('data-rendered','1');
}

async function main(){
  const param = new URLSearchParams(location.search).get('data') || 'storymap-example';
  try{
    const sm = await fetch('./data-'+param+'.json',{cache:'no-store'}).then(r=>{ if(!r.ok) throw new Error(r.status); return r.json(); });
    render(sm);
  }catch(err){
    document.getElementById('map').innerHTML = '<div class="err">Could not load data-'+esc(param)+'.json: '+esc(err.message)+'</div>';
    document.body.setAttribute('data-rendered','1');
  }
}
main();
</script>
</body>
</html>
