# /etc/nginx/sites-available/crm - one reverse proxy for both stands.
# certbot --nginx adds the https parts (listen 443, certificates, redirect).
server {
    listen 80;
    server_name crm.vprod.app;
    location / {
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/crm-proxy.conf;
    }
}

server {
    listen 80;
    server_name test-crm.vprod.app;
    # The test stand is closed with a password; the smoke check stays open.
    auth_basic "Test stand";
    auth_basic_user_file /etc/nginx/crm-staging.htpasswd;
    location = /api/health {
        auth_basic off;
        proxy_pass http://127.0.0.1:3002;
        include /etc/nginx/crm-proxy.conf;
    }
    location / {
        proxy_pass http://127.0.0.1:3002;
        include /etc/nginx/crm-proxy.conf;
    }
}
