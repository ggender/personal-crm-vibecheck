# Local Postgres and mailbox for the app: docker compose up -d
# Reachable only from this computer. Postgres is on port 5433 (5432 may be
# taken by another Postgres), no password: nothing outside localhost can
# connect.
services:
  db:
    image: postgres:17
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      # Code point order, as in the unit tests: the list sorts the same everywhere.
      POSTGRES_INITDB_ARGS: --locale-provider=builtin --locale=C.UTF-8
    volumes:
      - crm-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Mailpit catches every letter the app sends (login links): nothing leaves
  # this computer. Letters: http://localhost:8025. SMTP: port 1025.
  mailpit:
    image: axllent/mailpit:v1.31
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  crm-postgres:
